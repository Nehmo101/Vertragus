# Universal macOS packages need both optional @lydell/node-pty binaries.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

# pnpm reads build-script permissions from here.
# These packages run install/build scripts (Electron binary download, esbuild, sharp).
allowBuilds:
  electron: true
  # Windows-only installer tooling (electron-builder 26); its install scripts are
  # only needed on a Windows packaging host, so disabled for cross-platform installs.
  electron-winstaller: false
  esbuild: true
  sharp: true
  # Transitive from the Pi lockfile pin (`@google/genai` via pi-ai, protobufjs
  # via genai, optional koffi via pi-tui). Their install scripts are not needed
  # to spawn the bundled CLI; leaving them off keeps `pnpm install` from failing
  # on pnpm 11's ignored-builds gate.
  '@google/genai': false
  koffi: false
  protobufjs: false

# Force transitively-pulled dev tooling (e.g. vitest's bundled vite/esbuild) to
# patched versions that clear dev-server advisories (GHSA vite fs.deny / esbuild).
overrides:
  vite: '>=6.4.3'
  esbuild: '>=0.25.0'
