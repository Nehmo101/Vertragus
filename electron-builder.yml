# Packaging for Vertragus.
#
# `appId` matches the `setAppUserModelId` call in src/main/index.ts — Windows
# groups taskbar entries and toast notifications by that id, and a mismatch
# gives an installed app a second, nameless taskbar slot.
#
# The update channel lives in electron-builder.main.yml, which extends this
# file: a green main build publishes to the `main` channel (prerelease), a tag
# publishes to `latest`. See src/main/updater.ts for the reading side.
appId: org.nehmo.vertragus
productName: Vertragus
copyright: © Nehmo101

publish:
  provider: github
  owner: Nehmo101
  repo: Vertragus

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json

asarUnpack:
  # node-pty ships a native binding and a helper .exe; both must be real files
  # on disk, not asar entries, or spawning an agent fails at runtime.
  - '**/node_modules/@lydell/node-pty*/**'
  # Pi harness wrap: the CLI, photon WASM/native, the MCP adapter, and the
  # adapter's keyring binding must load from real files. JS-only trees would
  # run from asar; native/WASM next to them would not.
  - '**/node_modules/@mariozechner/**'
  - '**/node_modules/@silvia-odwyer/photon-node/**'
  - '**/node_modules/pi-mcp-adapter/**'
  - '**/node_modules/@napi-rs/**'

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  # Azure Trusted Signing, gated on the environment. electron-builder 26 has
  # native `azureSignOptions`, but the mere presence of that key switches the
  # signing manager and fails every build without Azure credentials — it cannot
  # be secrets-gated from a static config. The hook keeps the gate in the
  # environment instead: with the AZURE_* variables set (docs/SIGNING.md,
  # .github/workflows/release.yml) it signs via Invoke-TrustedSigning, without
  # them it no-ops loudly and the build stays green and unsigned.
  signtoolOptions:
    sign: ./scripts/azure-sign.mjs

nsis:
  # Per-user by design: Vertragus needs no elevation, and an installer that asks
  # for admin rights on every update is an update people stop installing.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vertragus

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Signing and notarization are secrets-gated: without a Developer ID
  # certificate (CSC_LINK) electron-builder skips signing entirely, and
  # `notarize: true` only acts when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are in the environment — a cert-less build stays exactly as
  # unsigned as before. The release workflow keeps unsigned macOS builds out
  # of releases because Squirrel.Mac refuses unsigned updates (docs/SIGNING.md).
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  # Electron's V8 JIT and @lydell/node-pty's native binding do not survive a
  # plain hardened runtime; these entitlements are the documented Electron set.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Prebuilt native addons land in both universal temp apps as identical
  # Mach-O files: per-arch optional packages (@lydell/node-pty, Pi clipboard,
  # @napi-rs/keyring) and unscoped trees that ship every arch in one folder
  # (koffi via pi-tui). @electron/universal refuses to skip lipo unless the
  # path matches this pattern. A scoped brace list is not enough — koffi has
  # no @scope. `**/node_modules/**` covers every addon and still excludes
  # Electron's own helpers. scripts/piHarnessPin.test.ts pins the glob.
  x64ArchFiles: '**/node_modules/**'
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Nehmo101
  artifactName: ${productName}-${version}.${ext}
